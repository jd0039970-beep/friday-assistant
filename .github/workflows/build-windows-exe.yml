name: Build Friday.exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/hud/**"
      - "config/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pywebview pyinstaller fastapi "uvicorn[standard]" httpx pyyaml numpy pillow pydantic python-multipart

      - name: Entry script
        working-directory: backend
        shell: pwsh
        run: |
          @"
          from app.desktop import main
          if __name__ == "__main__":
              main()
          "@ | Set-Content -Encoding UTF8 run_friday.py

      - name: Build Friday.exe (console so errors show)
        working-directory: backend
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --console --name Friday `
            --paths . `
            --add-data "../config;config" `
            --add-data "../frontend/hud;frontend/hud" `
            --hidden-import uvicorn `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import app `
            --hidden-import app.main `
            --hidden-import app.desktop `
            --hidden-import app.paths `
            --collect-all webview `
            run_friday.py

      - name: Zip dist
        working-directory: backend/dist
        shell: pwsh
        run: Compress-Archive -Path Friday -DestinationPath Friday-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Friday-windows
          path: backend/dist/Friday-windows.zip
          retention-days: 30
