llm:
  provider: ollama
  base_url: "http://localhost:11434"
  model: "qwen2.5:7b-instruct-q4_K_M"
  embed_model: "nomic-embed-text"
  temperature: 0.4
  max_tool_iterations: 10

server:
  host: "127.0.0.1"
  port: 8787

persona:
  name: "F.R.I.D.A.Y"
  tone: "calm, dry British wit, precise, protective, slightly sassy"

voice:
  enabled: true
  stt_model: "small.en"
  tts_engine: "piper"
  tts_voice: "en_GB-alba-medium"
  push_to_talk_hotkey: "ctrl+shift+space"
  wake_word: null

vision:
  ocr_enabled: true
  tesseract_lang: "eng"

memory:
  db_path: "~/.friday/memory.sqlite3"
  recall_k: 8

sandbox:
  docker_image: "friday-sandbox:latest"
  default_timeout_seconds: 120
  cpu_limit: "1.5"
  mem_limit: "1.5g"
  live_mode_ttl_minutes: 60
  # For offline / wired-only / forensics labs: allow any target to go live
  # without ownership attestation. Safe when the machine has no route to
  # the public internet (no WiFi/BT, or air-gapped).
  unrestricted_local: true

audit_log_path: "~/.friday/audit.log"

web:
  headless: true
  timeout_ms: 30000
